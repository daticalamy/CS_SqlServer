globalVariables:
  TAG: ${LB_TAG}
  CLONED_URL: ${LB_CLONED_URL}
  HISTORY_COUNT: ${LB_HISTORY_COUNT}
  ENV: ${ENVIRONMENT}
  
stages:

  # Validate changes
  Validation:
    actions: 
      - type: liquibase
        command: validate

  Status:
    actions:
      - type: liquibase
        command: status
        cmdArgs: {verbose: true, context-filter: "${ENV}"}

      - type: control
        if: "status.changesetCount == 0"
        command: exit
        cmdArgs: {exitCode: 0, exitMessage: "Exiting with an error status of 0 because the database is up-to-date"}

  Checks-Changelog:
   actions:
     - type: liquibase
       command: checks run
       cmdArgs: {checks-scope: changelog, changeset-filter: "PENDING", report-name: "checks-report-premerge.html", context-filter: "${ENV}"}

  # Create Ephemeral Database from a dacpac
  Create-EphemeralDB:
    actions:
      - type: shell
        command: |
          sqlcmd -b -U "${LIQUIBASE_COMMAND_USERNAME}" -P "${LIQUIBASE_COMMAND_PASSWORD}" -S "tcp:%LB_HOSTNAME%,%LB_PORT%" -C -d "master" -Q "SET NOCOUNT ON; IF DB_ID(N'%LB_DATABASENAME%_eph') IS NOT NULL THROW 50000, 'Ephemeral database %LB_DATABASENAME%_eph already exists, likely left over from a previous run. Drop it and re-run.', 1;" || (echo ERROR: Pre-check failed - ephemeral database already exists or server unreachable. & exit /b 1)
          sqlpackage /Action:Extract /SourceServerName:"tcp:%LB_HOSTNAME%,%LB_PORT%" /SourceDatabaseName:"%LB_DATABASENAME%" /SourceUser:"${LIQUIBASE_COMMAND_USERNAME}" /SourcePassword:"${LIQUIBASE_COMMAND_PASSWORD}" /SourceTrustServerCertificate:True /TargetFile:"%TEMP%\%LB_DATABASENAME%_eph.dacpac" /OverwriteFiles:True || (echo ERROR: sqlpackage extract failed for %LB_DATABASENAME%. & exit /b 1)
          sqlpackage /Action:Publish /SourceFile:"%TEMP%\%LB_DATABASENAME%_eph.dacpac" /TargetServerName:"tcp:%LB_HOSTNAME%,%LB_PORT%" /TargetDatabaseName:"%LB_DATABASENAME%_eph" /TargetUser:"${LIQUIBASE_COMMAND_USERNAME}" /TargetPassword:"${LIQUIBASE_COMMAND_PASSWORD}" /TargetTrustServerCertificate:True /p:CreateNewDatabase=True /p:ExcludeObjectTypes="Users;RoleMembership;Permissions;Logins" || (echo ERROR: sqlpackage publish failed - ephemeral database %LB_DATABASENAME%_eph may be partially created and will be dropped in cleanup. & exit /b 1)
          sqlcmd -b -U "${LIQUIBASE_COMMAND_USERNAME}" -P "${LIQUIBASE_COMMAND_PASSWORD}" -S "tcp:%LB_HOSTNAME%,%LB_PORT%" -C -d "master" -Q "SET NOCOUNT ON; IF DB_ID(N'%LB_DATABASENAME%_eph') IS NULL THROW 50001, 'Ephemeral database %LB_DATABASENAME%_eph does not exist after publish.', 1;" || (echo ERROR: Ephemeral database %LB_DATABASENAME%_eph is missing after publish. This is a copy failure, not a login issue. & exit /b 1)
          sqlcmd -b -U "${LIQUIBASE_COMMAND_USERNAME}" -P "${LIQUIBASE_COMMAND_PASSWORD}" -S "tcp:%LB_HOSTNAME%,%LB_PORT%" -C -d "master" -Q "INSERT INTO [%LB_DATABASENAME%_eph].%LIQUIBASE_LIQUIBASE_SCHEMA_NAME%.DATABASECHANGELOG SELECT * FROM [%LB_DATABASENAME%].%LIQUIBASE_LIQUIBASE_SCHEMA_NAME%.DATABASECHANGELOG" || (echo ERROR: Failed to copy DATABASECHANGELOG into %LB_DATABASENAME%_eph. & exit /b 1)

  # Deploy to ephemeral database
  Tag-and-Deploy-to-EphemeralDB:
    actions:
      - type: liquibase
        command: tag
        cmdArgs: { URL: "${CLONED_URL}", tag: "${TAG}" }
        
      # Run the update (with testing rollback)
      - type: liquibase
        command: update-testing-rollback
        cmdArgs: { URL: "${CLONED_URL}", report-name: "clone-report.html", context-filter: "${ENV}" }

      - type: liquibase
        command: history
        cmdArgs: { URL: "${CLONED_URL}", count: "${HISTORY_COUNT}" }

endStage:
  actions:

    # Drop Ephemeral Database if it exists
    - type: shell
      command: sqlcmd -b -U "${LIQUIBASE_COMMAND_USERNAME}" -P "${LIQUIBASE_COMMAND_PASSWORD}" -S "tcp:%LB_HOSTNAME%,%LB_PORT%" -C -d "master" -Q "IF DB_ID('%LB_DATABASENAME%_eph') IS NOT NULL BEGIN ALTER DATABASE [%LB_DATABASENAME%_eph] SET SINGLE_USER WITH ROLLBACK IMMEDIATE; DROP DATABASE [%LB_DATABASENAME%_eph]; PRINT 'Dropped ephemeral database %LB_DATABASENAME%_eph.'; END ELSE PRINT 'No ephemeral database %LB_DATABASENAME%_eph to drop.';"

    # Remove the temporary dacpac
    - type: shell
      command: if exist "%TEMP%\%LB_DATABASENAME%_eph.dacpac" del /q "%TEMP%\%LB_DATABASENAME%_eph.dacpac" & exit /b 0