globalVariables:
  TAG: ${LB_TAG}
  CLONED_URL: ${LB_CLONED_URL}
  
stages:

  # Validate changes
  Validation:
    actions: 
      - type: liquibase
        command: validate

  Status:
    actions:
      - type: liquibase
        command: status
        cmdArgs: {verbose: true}

      - type: control
        if: "status.changesetCount == 0"
        command: exit
        cmdArgs: {exitCode: 0, exitMessage: "Exiting with an error status of 0 because the database is up-to-date"}

  Checks-Changelog:
   actions:
     - type: liquibase
       command: checks run
       cmdArgs: {checks-scope: changelog, changeset-filter: "PENDING", report-name: "checks-report-premerge.html"}

  # Create Clone Database
  Create-EphemeralDB:
    actions:
      - type: shell
        command: |
          sqlcmd -b -U "${LIQUIBASE_COMMAND_USERNAME}" -P "${LIQUIBASE_COMMAND_PASSWORD}" -S "tcp:%LB_HOSTNAME%,%LB_PORT%" -C -d "master" -Q "DBCC CLONEDATABASE([%LB_DATABASENAME%], [%LB_DATABASENAME%_eph]) WITH VERIFY_CLONEDB" || exit /b 1
          sqlcmd -b -U "${LIQUIBASE_COMMAND_USERNAME}" -P "${LIQUIBASE_COMMAND_PASSWORD}" -S "tcp:%LB_HOSTNAME%,%LB_PORT%" -C -d "master" -Q "ALTER DATABASE [%LB_DATABASENAME%_eph] SET READ_WRITE" || exit /b 1
          sqlcmd -b -U "${LIQUIBASE_COMMAND_USERNAME}" -P "${LIQUIBASE_COMMAND_PASSWORD}" -S "tcp:%LB_HOSTNAME%,%LB_PORT%" -C -d "master" -Q "INSERT INTO [%LB_DATABASENAME%_eph].%LIQUIBASE_LIQUIBASE_SCHEMA_NAME%.DATABASECHANGELOG SELECT * FROM [%LB_DATABASENAME%].%LIQUIBASE_LIQUIBASE_SCHEMA_NAME%.DATABASECHANGELOG" || exit /b 1
          
  # Deploy to ephemeral database
  Tag-and-Deploy-to-EphemeralDB:
    actions:
      - type: liquibase
        command: tag
        cmdArgs: { URL: "${CLONED_URL}", tag: "${TAG}" }
        
      # Run the update (with testing rollback)
      - type: liquibase
        command: update-testing-rollback
        cmdArgs: { URL: "${CLONED_URL}", report-name: "clone-report.html" }

      - type: liquibase
        command: history
        cmdArgs: { URL: "${CLONED_URL}" }
        
