endStage:
  actions:
    # Drop Ephemeral Database if it exists
    - type: shell
      command: sqlcmd -b -U "${LIQUIBASE_COMMAND_USERNAME}" -P "${LIQUIBASE_COMMAND_PASSWORD}" -S "tcp:%LB_HOSTNAME%,%LB_PORT%" -C -d "master" -Q "IF DB_ID('%LB_DATABASENAME%_eph') IS NOT NULL BEGIN ALTER DATABASE [%LB_DATABASENAME%_eph] SET SINGLE_USER WITH ROLLBACK IMMEDIATE; DROP DATABASE [%LB_DATABASENAME%_eph]; END"