##########           LIQUIBASE FLOWFILE                ##########
##########  learn more http://docs.liquibase.com/flow  ##########

globalVariables:
  ENV: ${ENVIRONMENT}
  CONTAINER: ${AZURE_CONTAINER} 
  SCHEMAS: ${LB_SCHEMAS}
  UTILITY: ${LB_UTILITY}
  REF_ENV: ${LB_REFERENCE_ENV}

stages:
  Utility:
    actions:
    
      - type: shell
        command: echo 'Running ${UTILITY}'    
    
      - type: liquibase
        if: "${UTILITY} == changelog-sync"
        command: changelog-sync
        cmdArgs: { context-filter: "${ENV}" }

      - type: liquibase
        if: "${UTILITY} == connect"
        command: connect
  
      - type: liquibase
        if: "${UTILITY} == diff"
        command: diff
        cmdArgs: { schemas: "${SCHEMAS}", drift-severity: "1", reference-url: "offline:mssql?snapshot=${REF_ENV}-snapshot.json", report-name: "drift-report-${ENV}-to-${REF_ENV}.html" }
        
      - type: liquibase
        if: "${UTILITY} == generate-changelog"
        command: generate-changelog
        cmdArgs: { changelog-file: 'generatechangelogs/${ENV}/${ENV}-changelog.mssql.sql', overwrite-output-file: "true", schemas: "${SCHEMAS}", object-changelogs: "by-table" }
        globalArgs: { changelog-pretty-print-sql: "true" }

      - type: shell
        if: "${UTILITY} == generate-changelog"
        command: echo 'Generate Changelog saved to generatechangelogs/${ENV}/${ENV}-changelog.mssql.sql'

      - type: liquibase
        if: "${UTILITY} == history"
        command: history

      - type: liquibase
        if: "${UTILITY} == release-locks"
        command: release-locks

      - type: liquibase
        if: "${UTILITY} == snapshot"
        command: snapshot
        cmdArgs: {  snapshot-format: json, schemas: "${SCHEMAS}"}
        globalArgs: { output-file: 'az://${CONTAINER}/gh_sqlserver_snapshots/${ENV}-snapshot.json' }
        
      - type: shell
        if: "${UTILITY} == snapshot"
        command: echo 'Snapshot saved to az://${CONTAINER}/gh_sqlserver_snapshots/${ENV}-snapshot.json'

      - type: liquibase
        if: "${UTILITY} == status"
        command: status
        cmdArgs: {verbose: true, context-filter: "${ENV}"}