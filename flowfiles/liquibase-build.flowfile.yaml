##########           LIQUIBASE FLOWFILE                ##########
##########  learn more http://docs.liquibase.com/flow  ##########

## Note: Any command which fails in any stage below result in the command stopping, and endStage being run.
## A flow file can have one or more stages, each with multiple "actions", 
## or your flow file can have multiple stages with fewer actions in each stage.
globalVariables:
  TAG: ${LB_TAG}
  ENV: ${ENVIRONMENT}
  HISTORY_COUNT: ${LB_HISTORY_COUNT}

stages:
  Validation:
    actions: 
      - type: liquibase
        command: validate

  Status:
    actions:
      - type: liquibase
        command: status
        cmdArgs: {verbose: true, context-filter: "${ENV}"}
        
      - type: control
        if: "status.changesetCount == 0"
        command: exit
        cmdArgs: {exitCode: 0, exitMessage: "Exiting with an error status of 0 because the database is up-to-date"}

  Checks-Changelog:
    actions:
      - type: liquibase
        command: checks run
        cmdArgs: {checks-scope: changelog, changeset-filter: "PENDING", report-name: "checks-report-build.html", context-filter: "${ENV}"}

  Tag:
    actions:
      - type: liquibase
        command: tag
        cmdArgs: {tag: "${TAG}"}

  Update:
    actions:
      - type: liquibase
        command: update-testing-rollback
        cmdArgs: { report-name: "build-report.html", context-filter: "${ENV}"}

## The endStage ALWAYS RUNS. 
## So put actions here which you desire to perform whether previous stages' actions succeed or fail.
## If you do not want any actions to ALWAYS RUN, simply delete the endStage from your flow file.

endStage:
  actions:
    - type: liquibase
      command: history
      cmdArgs: {count: "${HISTORY_COUNT}"}