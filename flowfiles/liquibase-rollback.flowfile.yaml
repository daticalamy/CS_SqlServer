##########           LIQUIBASE FLOWFILE                ##########
##########  learn more http://docs.liquibase.com/flow  ##########

globalVariables:
  ROLLBACK_TYPE: ${ROLLBACK_TYPE}
  TAG: ${LB_TAG}
  COUNT: ${LB_COUNT}
  CHANGESET_ID: ${LB_CHANGESET_ID}
  CHANGESET_AUTHOR: ${LB_CHANGESET_AUTHOR}
  CHANGESET_PATH: ${LB_CHANGESET_PATH}
  DEPLOYMENT_ID: ${LB_DEPLOYMENT_ID}
  FORCE: true
  ENV: ${ENVIRONMENT}
  SCHEMAS: ${LB_SCHEMAS}
  CONTAINER: ${AZURE_CONTAINER}
  DRY_RUN: ${LB_DRY_RUN}

stages:
  Validate-Inputs:
    actions:
      - type: shell
        command: |
          case "${ROLLBACK_TYPE}" in
            rollback_to_tag)
              if [ -z "${TAG}" ]; then
                echo "ERROR: 'lb_tag' is required when rollback_type is 'rollback_to_tag'." >&2
                exit 1
              fi
              ;;
            rollback_count)
              if [ -z "${COUNT}" ]; then
                echo "ERROR: 'lb_count' is required when rollback_type is 'rollback_count'." >&2
                exit 1
              fi
              ;;
            rollback_one_changeset)
              if [ -z "${CHANGESET_ID}" ] || [ -z "${CHANGESET_AUTHOR}" ] || [ -z "${CHANGESET_PATH}" ]; then
                echo "ERROR: 'changeset_id', 'changeset_author', and 'changeset_path' are all required when rollback_type is 'rollback_one_changeset'." >&2
                exit 1
              fi
              ;;
            rollback_one_update)
              if [ -z "${DEPLOYMENT_ID}" ]; then
                echo "NOTE: 'deployment_id' was not supplied - the most recent update will be rolled back."
              fi
              ;;
            *)
              echo "ERROR: Unrecognized rollback_type '${ROLLBACK_TYPE}'." >&2
              exit 1
              ;;
          esac
          echo "Input validation passed for rollback_type=${ROLLBACK_TYPE}"

  Rollback-Logging:
    actions:
      - type: shell
        command: echo 'Attempting to rollback using Rollback Type ${ROLLBACK_TYPE} and Dry Run ${DRY_RUN}'

  Rollback-To-Tag-SQL:
    actions:
      - type: liquibase
        if: "${ROLLBACK_TYPE} == rollback_to_tag && ${DRY_RUN} == true"
        command: rollback-sql
        cmdArgs: {tag: "${TAG}", report-name: "sql-rollback-report-${ENV}.html"}

  Rollback-To-Tag:
    actions:
      - type: liquibase
        if: "${ROLLBACK_TYPE} == rollback_to_tag && ${DRY_RUN} == false"
        command: rollback
        cmdArgs: {tag: "${TAG}", report-name: "rollback-report-${ENV}.html"}

  Rollback-Count-SQL:
    actions:
      - type: liquibase
        if: "${ROLLBACK_TYPE} == rollback_count && ${DRY_RUN} == true"
        command: rollback-sql
        cmdArgs: {count: "${COUNT}", report-name: "sql-rollback-report-${ENV}.html"}

  Rollback-Count:
    actions:
      - type: liquibase
        if: "${ROLLBACK_TYPE} == rollback_count && ${DRY_RUN} == false"
        command: rollback
        cmdArgs: {count: "${COUNT}", report-name: "rollback-report-${ENV}.html"}

  Rollback-One-Changeset-SQL:
    actions:
      - type: liquibase
        if: "${ROLLBACK_TYPE} == rollback_one_changeset && ${DRY_RUN} == true"
        command: rollback-one-changeset-sql
        cmdArgs: {changeset-id: "${CHANGESET_ID}", changeset-author: "${CHANGESET_AUTHOR}", changeset-path: "${CHANGESET_PATH}", force: "${FORCE}", report-name: "sql-rollback-report-${ENV}.html"}

  Rollback-One-Changeset:
    actions:
      - type: liquibase
        if: "${ROLLBACK_TYPE} == rollback_one_changeset && ${DRY_RUN} == false"
        command: rollback-one-changeset
        cmdArgs: {changeset-id: "${CHANGESET_ID}", changeset-author: "${CHANGESET_AUTHOR}", changeset-path: "${CHANGESET_PATH}", force: "${FORCE}", report-name: "rollback-report-${ENV}.html"}

  Rollback-One-Update-SQL:
    actions:
      - type: liquibase
        if: "${ROLLBACK_TYPE} == rollback_one_update && ${DRY_RUN} == true"
        command: rollback-one-update-sql
        cmdArgs: {deployment-id: "${DEPLOYMENT_ID}", force: "${FORCE}", report-name: "sql-rollback-report-${ENV}.html"}

  Rollback-One-Update:
    actions:
      - type: liquibase
        if: "${ROLLBACK_TYPE} == rollback_one_update && ${DRY_RUN} == false"
        command: rollback-one-update
        cmdArgs: {deployment-id: "${DEPLOYMENT_ID}", force: "${FORCE}", report-name: "rollback-report-${ENV}.html"}

## The endStage ALWAYS RUNS.
## So put actions here which you desire to perform whether previous stages' actions succeed or fail.
## If you do not want any actions to ALWAYS RUN, simply delete the endStage from your flow file.

endStage:
  actions:
    - type: liquibase
      command: snapshot
      cmdArgs: {  snapshot-format: json, schemas: "${SCHEMAS}", snapshot-filters: "column,foreignkey,index,primarykey,table,uniqueconstraint,view,checkconstraint,trigger"}
      globalArgs: { output-file: 'az://${CONTAINER}/gh_sqlserver_snapshots/${ENV}-snapshot.json' }
        
    - type: shell
      command: echo 'Updated snapshot saved to az://${CONTAINER}/gh_sqlserver_snapshots/${ENV}-snapshot.json'   

    - type: liquibase
      command: history
