databaseChangeLog:
      
  - includeAll:
      path: Tables
      relativeToChangelogFile: true
      errorIfMissingOrEmpty: false

  - includeAll:
      path: Procedures
      relativeToChangelogFile: true
      errorIfMissingOrEmpty: false

  - includeAll:
      path: Views
      relativeToChangelogFile: true
      errorIfMissingOrEmpty: false

  # Changelogs generated by decorate-sql from raw_sql/ (see raw_sql/README.md).
  # Do not rename or move files here: changeset identity includes the file path.
  - includeAll:
      path: Decorated
      relativeToChangelogFile: true
      errorIfMissingOrEmpty: false

  - modifyChangeSets:
      runWith: sqlcmd
      includeAll:
        - path: Data_Dml
        - labels: DATA_DML
        - relativeToChangelogFile: true
        - errorIfMissingOrEmpty: false

  - modifyChangeSets:
      runWith: sqlcmd
      includeAll:
        - path: Vendor_Scripts
        - labels: VENDOR
        - relativeToChangelogFile: true
        - errorIfMissingOrEmpty: false