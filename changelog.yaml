databaseChangeLog:
      
  - includeAll:
      path: scripts/Tables
      relativeToChangelogFile: true
      errorIfMissingOrEmpty: false

  - includeAll:
      path: scripts/Procedures
      relativeToChangelogFile: true
      errorIfMissingOrEmpty: false

  - includeAll:
      path: scripts/Views
      relativeToChangelogFile: true
      errorIfMissingOrEmpty: false

  - modifyChangeSets:
      runWith: sqlcmd
      includeAll:
        - path: scripts/Data_Dml
        - labels: DATA_DML
        - relativeToChangelogFile: true
        - errorIfMissingOrEmpty: false

  - modifyChangeSets:
      runWith: sqlcmd
      includeAll:
        - path: scripts/Vendor_Scripts
        - labels: VENDOR
        - relativeToChangelogFile: true
        - errorIfMissingOrEmpty: false