#############################################################################
#  GitHub Action to convert raw SQL scripts into Liquibase changelogs
#  with decorate-sql (Liquibase Secure 6.0.2+).
#
#  All decorate logic lives in the flow files:
#    flowfiles/liquibase-decorate.windows.flowfile.yaml   (PowerShell)
#    flowfiles/liquibase-decorate.linux.flowfile.yaml     (bash)
#  This workflow picks the one for the runner's OS, runs it, and commits the
#  result back to the branch so it is reviewed in the pull request.
#
#  Raw script naming (directly under raw_sql/):
#    <name>.sql                        inline --rollbackSQL markers
#    <name>.up.sql + <name>.down.sql   paired Up/Down scripts
##############################################################################
name: 'Liquibase Decorate Raw SQL'
run-name: decorate raw SQL on ${{ github.ref_name }} by ${{ github.actor }}

on:
  push:
    branches-ignore:
      - main
    paths:
      - 'raw_sql/*.sql'      # top level only; raw_sql/processed/ is ignored
  workflow_dispatch:

permissions:
  contents: write            # needed to push the decorated changelogs back

concurrency:
  group: decorate-${{ github.ref }}
  cancel-in-progress: false

env:

  # Liquibase Platform Settings
  LIQUIBASE_PLATFORM_ENABLED: true
  LIQUIBASE_PLATFORM_API_URL: https://cs-ci.liquibase.net/api/operations/ingest
  LIQUIBASE_PLATFORM_API_KEY: ${{ secrets.LIQUIBASE_PLATFORM_API_KEY }}
  LIQUIBASE_PLATFORM_CONNECTION_IDENTIFIER: ${{ vars.LIQUIBASE_PLATFORM_CONNECTION_IDENTIFIER }}
  LIQUIBASE_PLATFORM_CHANGELOG_IDENTIFIER: ${{ vars.LIQUIBASE_PLATFORM_CHANGELOG_IDENTIFIER }}

  # Liquibase License Tracking Settings (also needs PLATFORM_API_KEY from above)
  LIQUIBASE_LICENSE_TRACKING_ENABLED: true
  LIQUIBASE_LICENSE_ENDPOINT_URL: https://cs-ci.liquibase.net/api/licenses/access
  # Optional fallback if the endpoint is unreachable:
  # LIQUIBASE_LICENSE_KEY: ${{ secrets.LIQUIBASE_LICENSE_KEY }}

  # Read by the decorate flow files (AUTHOR variable)
  LB_AUTHOR: ${{ github.actor }}          # author stamped on every generated changeset

  # Used by the commit step below; must match the flow files' globalVariables
  RAW_SQL_DIR: raw_sql
  DECORATED_DIR: changelogs/Decorated

  # Search path (See https://docs.liquibase.com/concepts/changelogs/how-liquibase-finds-files.html)
  LIQUIBASE_SEARCH_PATH: .,flowfiles,policychecks,changelogs

  # Values: OFF, SEVERE, WARNING, INFO, FINE
  LIQUIBASE_LOG_LEVEL: INFO
  LIQUIBASE_LOG_FORMAT: JSON_PRETTY
  LIQUIBASE_LOG_FILE: logs/log.json

  # DBCL / History Settings
  LIQUIBASE_DBCLHISTORY_ENABLED: true

jobs:
  decorate-raw-sql:
    runs-on: [self-hosted]
    # The license key secret lives on the environments, so borrow DEV's.
    # decorate-sql never connects to the database.
    environment: DEV
    steps:
    - uses: actions/checkout@v5
      with:
        ref: ${{ github.ref_name }}

    - name: Setup Liquibase Environment
      uses: ./.github/workflows/setup-liquibase
      with:
        ca-cert-path: certs/cs-ci-ca.cer

    # Windows runners use the PowerShell flow, Linux runners the bash flow.
    - name: Liquibase Decorate Flow
      env:
        LIQUIBASE_COMMAND_FLOW_SHELL_INTERPRETER: powershell
      run: liquibase flow --flow-file=liquibase-decorate.flowfile.yaml

    # bash works on Linux runners and on Windows runners with Git Bash.
    - name: Commit decorated changelogs to the branch
      shell: bash
      env:
        BRANCH: ${{ github.ref_name }}
      run: |
        set -e
        git add -- "$DECORATED_DIR" "$RAW_SQL_DIR"
        if git diff --cached --quiet; then echo "Nothing decorated; nothing to commit."; exit 0; fi

        git config user.name  "github-actions[bot]"
        git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
        git commit -m "Decorate raw SQL for $LB_AUTHOR" -m "Generated by decorate-sql (flowfiles/liquibase-decorate.flowfile.yaml)."

        # Pick up any commits pushed while this job ran, then push.
        git pull --rebase origin "$BRANCH"
        git push origin "HEAD:$BRANCH"

    - name: Upload partial decorate output for debugging
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: decorate-output-${{ github.run_id }}
        path: |
          changelogs/Decorated/
        if-no-files-found: ignore
