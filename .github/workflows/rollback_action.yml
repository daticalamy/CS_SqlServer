####################################################################
#  GitHub Action to perform an environment-targeted rollback of
#  database changes using Liquibase Secure and Flows.
#####################################################################
name: 'Liquibase Rollback'
run-name: ${{ inputs.environment}} rollback by ${{ github.actor }}

on:
  workflow_dispatch:
    # Following are the inputs received via the GitHubActions Run workflow dialog
    inputs:
      # The type 'environment' will automatically pull in the environments created in GitHub
      environment:
        description: 'Environment for rollback'
        type: environment
        required: true

      rollback_type:
        description: 'Select an option'
        type: choice
        required: true
        options:
          - rollback_to_tag
          - rollback_count
          - rollback_one_changeset
          - rollback_one_update

      dry_run:
        description: 'Dry Run (no changes applied to the database)'
        type: boolean
        required: true
        default: false

      # Tag (only used if rollback_type == rollback_to_tag)
      lb_tag:
        description: 'Tag for Rollback (required for rollback_to_tag)'
        type: string
        required: false     

      # Count (only used if rollback_type == rollback_count)
      lb_count:
        description: 'Count for Rollback (required for rollback_count)'
        type: string
        required: false

      # Changeset Fields (only used if rollback_type == rollback_one_changeset)
      lb_changeset_id:
        description: 'Changeset ID (required for rollback_one_changeset)'
        type: string
        required: false

      lb_changeset_author:
        description: 'Changeset Author (required for rollback_one_changeset)'
        type: string
        required: false

      lb_changeset_path:
        description: 'Changeset File Path (required for rollback_one_changeset)'
        type: string
        required: false

      # Deployment ID (only used if rollback_type == rollback_one_update)
      lb_deployment_id:
        description: 'Deployment ID for rollback_one_update (optional - if left blank, the most recent update is rolled back)'
        type: string
        required: false

####################################################################
#  Set up the environment
#####################################################################
env:
  # Azure Storage account and container to hold reports
  LIQUIBASE_AZURE_STORAGE_ACCOUNT: cssnapshots
  AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
  AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
  AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
  AZURE_CONTAINER: ${{ vars.AZURE_CONTAINER }}
  
  # Pro License key
  # See https://docs.liquibase.com/workflows/liquibase-pro/how-to-apply-your-liquibase-pro-license-key.html
  LIQUIBASE_LICENSE_KEY: ${{ secrets.LIQUIBASE_LICENSE_KEY }}
  
  # JDBC URL of the database per environment
  # See https://docs.liquibase.com/workflows/liquibase-community/using-jdbc-url-in-liquibase.html
  LIQUIBASE_COMMAND_URL: ${{ vars.LIQUIBASE_URL }}

  # Credentials for the environment's database https://docs.liquibase.com/parameters/command-parameters.html
  LIQUIBASE_COMMAND_USERNAME: ${{ secrets.LIQUIBASE_COMMAND_USERNAME }}
  LIQUIBASE_COMMAND_PASSWORD: ${{ secrets.LIQUIBASE_COMMAND_PASSWORD }}

  # Liquibase schema: Specified to allow flexibility in storage of Liquibase Change Tracking Tables
  # See https://docs.liquibase.com/parameters/liquibase-schema-name.html
  #LIQUIBASE_LIQUIBASE_SCHEMA_NAME: LB

  # Search path (See https://docs.liquibase.com/concepts/changelogs/how-liquibase-finds-files.html)
  LIQUIBASE_SEARCH_PATH: .,flowfiles,policychecks
  
  # The database changelog. See https://docs.liquibase.com/concepts/changelogs/working-with-changelogs.html
  LIQUIBASE_COMMAND_CHANGELOG_FILE: changelog.yaml
  
  ENVIRONMENT: ${{ inputs.environment }}
  
  LB_DRY_RUN: ${{ github.event.inputs.dry_run }}

  # Rollback
  ROLLBACK_TYPE: ${{ github.event.inputs.rollback_type }}
  LB_TAG: ${{ github.event.inputs.lb_tag }}
  LB_COUNT: ${{ github.event.inputs.lb_count }}
  LB_CHANGESET_ID: ${{ github.event.inputs.lb_changeset_id }}
  LB_CHANGESET_AUTHOR: ${{ github.event.inputs.lb_changeset_author }}
  LB_CHANGESET_PATH: ${{ github.event.inputs.lb_changeset_path }}
  LB_DEPLOYMENT_ID: ${{ github.event.inputs.lb_deployment_id }}
  
  # For Snapshot/Drift Detection
  LB_SCHEMAS: "DBO,Sales"

  # Reports
  #LIQUIBASE_REPORT_PATH: az://reports/gh_sqlserver_reports
  LIQUIBASE_REPORT_PATH: reports
  
  # Values: OFF, SEVERE, WARNING, INFO, FINE
  LIQUIBASE_LOG_LEVEL: INFO
  LIQUIBASE_LOG_FORMAT: JSON_PRETTY
  LIQUIBASE_LOG_FILE: logs/log.json

  # History Table
  LIQUIBASE_DBCLHISTORY_ENABLED: true

jobs:
  #########################################################################
  #  Rollback
  #########################################################################

  rollback-to-tag:
    runs-on: [self-hosted]
    if: ${{ inputs.rollback_type == 'rollback_to_tag' }}
    steps:
      - name: Validate required inputs
        run: |
          if ([string]::IsNullOrWhiteSpace($env:LB_TAG)) {
            Write-Host "::error::tag is required for rollback_to_tag"
            exit 1
          }
      - name: Run tag rollback
        run: |
          echo "Rolling back to tag ${{ inputs.lb_tag }} (Dry Run: ${{ inputs.dry_run }})"

  rollback-count:
    runs-on: [self-hosted]
    if: ${{ inputs.rollback_type == 'rollback_count' }}
    steps:
      - name: Validate required inputs
        run: |
          if ([string]::IsNullOrWhiteSpace($env:LB_COUNT)) {
            Write-Host "::error::count is required for rollback_count"
            exit 1
          }
      - name: Run count rollback
        run: |
          echo "Rolling back ${{ inputs.lb_count }} changesets (Dry Run: ${{ inputs.dry_run }})"

  rollback-one-changeset:
    runs-on: [self-hosted]
    if: ${{ inputs.rollback_type == 'rollback_one_changeset' }}
    steps:
      - name: Validate required inputs
        run: |
          if ([string]::IsNullOrWhiteSpace($env:LB_CHANGESET_ID) -or
              [string]::IsNullOrWhiteSpace($env:LB_CHANGESET_AUTHOR) -or
              [string]::IsNullOrWhiteSpace($env:LB_CHANGESET_PATH)) {
            Write-Host "::error::changeset ID, author, and path are required for rollback_one_changeset"
            exit 1
          }
      - name: Run changeset rollback
        run: |
          echo "Rolling back changeset ${{ inputs.changeset_id }} by ${{ inputs.changeset_author }} at ${{ inputs.changeset_path }} (Dry Run: ${{ inputs.dry_run }})"

  rollback-one-update:
    runs-on: [self-hosted]
    if: ${{ inputs.rollback_type == 'rollback_one_update' }}
    steps:
      - name: Run one update rollback
        run: |
          if ([string]::IsNullOrWhiteSpace($env:LB_DEPLOYMENT_ID)) {
            Write-Host "No deployment ID given; rolling back the most recent update"
          } else {
            Write-Host "Rolling back deployment $env:LB_DEPLOYMENT_ID (Dry Run: ${{ inputs.dry_run }})"
          }

  database-rollback:
    runs-on: [self-hosted]
    needs: [rollback-to-tag, rollback-count, rollback-one-changeset, rollback-one-update]
    if: |
      always() &&
      (needs.rollback-to-tag.result == 'success' || needs.rollback-to-tag.result == 'skipped') &&
      (needs.rollback-count.result == 'success' || needs.rollback-count.result == 'skipped') &&
      (needs.rollback-one-changeset.result == 'success' || needs.rollback-one-changeset.result == 'skipped') &&
      (needs.rollback-one-update.result == 'success' || needs.rollback-one-update.result == 'skipped') &&
      (needs.rollback-to-tag.result == 'success' || needs.rollback-count.result == 'success' || needs.rollback-one-changeset.result == 'success' || needs.rollback-one-update.result == 'success')

    environment: ${{ inputs.environment }}
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Liquibase Environment
      uses: ./.github/workflows/setup-liquibase
 
    - name: Liquibase Rollback Flow
      run: liquibase flow --flow-file=liquibase-rollback.flowfile.yaml

    - name: Upload Reports Artifact
      if: always()
      uses: ./.github/workflows/upload-reports
      with:
        job-type: rollback
        upload-other: false