####################################################################
#  GitHub Action to perform various Liquibase utilities.
#####################################################################
name: 'Liquibase Secure Utilities'
run-name: ${{ inputs.environment}} utilities by ${{ github.actor }}

on:
  workflow_dispatch:
    # Following are the inputs received via the GitHubActions Run workflow dialog
    inputs:
      # The type 'environment' will automatically pull in the environments created in GitHub
      environment:
        description: 'Environment'
        type: environment
        required: true     

      utility:
        description: 'Utility to run'
        type: choice
        required: true
        options:
        - changelog-sync
        - connect
        - diff
        - diff-changelog
        - generate-changelog
        - history
        - release-locks
        - snapshot
        - status

      reference_snapshot:
        description: 'Reference snapshot (required for diff and diff-changelog)'
        type: choice
        required: false
        options:
        - DEV
        - QA
        - PROD
       
####################################################################
#  Set up the environment
#####################################################################
env:
  # Azure Storage account and container to hold snapshots
  LIQUIBASE_AZURE_STORAGE_ACCOUNT: cssnapshots
  AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
  AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
  AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
  AZURE_CONTAINER: ${{ vars.AZURE_CONTAINER }}

  # License key
  LIQUIBASE_LICENSE_KEY: ${{ secrets.LIQUIBASE_LICENSE_KEY }}
  
  # JDBC URL of the database per environment
  # See https://docs.liquibase.com/workflows/liquibase-community/using-jdbc-url-in-liquibase.html
  #LIQUIBASE_COMMAND_URL: ${{ vars.LIQUIBASE_URL_INTEGRATED_SECURITY }}
  LIQUIBASE_COMMAND_URL: ${{ vars.LIQUIBASE_URL }}

  # Credentials for the environment's database https://docs.liquibase.com/parameters/command-parameters.html
  LIQUIBASE_COMMAND_USERNAME: ${{ secrets.LIQUIBASE_COMMAND_USERNAME }}
  LIQUIBASE_COMMAND_PASSWORD: ${{ secrets.LIQUIBASE_COMMAND_PASSWORD }}

  # Liquibase schema: Specified to allow flexibility in storage of Liquibase Change Tracking Tables
  # See https://docs.liquibase.com/parameters/liquibase-schema-name.html
  #LIQUIBASE_LIQUIBASE_SCHEMA_NAME: LB

  # Search path (See https://docs.liquibase.com/concepts/changelogs/how-liquibase-finds-files.html)
  LIQUIBASE_SEARCH_PATH: .,flowfiles,policychecks,az://${{ vars.AZURE_CONTAINER }}/gh_sqlserver_snapshots/

  # The database changelog. See https://docs.liquibase.com/concepts/changelogs/working-with-changelogs.html
  LIQUIBASE_COMMAND_CHANGELOG_FILE: changelog.yaml
  
  ENVIRONMENT: ${{ inputs.environment }}
  LB_UTILITY: ${{ inputs.utility }}
  LB_REFERENCE_ENV: ${{ inputs.reference_snapshot }}
  
  # Drift Detection
  LB_SCHEMAS: "DBO,Sales"

  # Reports
  #LIQUIBASE_REPORT_PATH: az://reports/gh_sqlserver_reports
  LIQUIBASE_REPORT_PATH: reports
  
  # Values: OFF, SEVERE, WARNING, INFO, FINE
  LIQUIBASE_LOG_LEVEL: INFO
  LIQUIBASE_LOG_FORMAT: JSON_PRETTY
  LIQUIBASE_LOG_FILE: logs/log.json

  # History Table
  LIQUIBASE_DBCLHISTORY_ENABLED: true

jobs:
  #########################################################################
  #  Run Utilities
  #########################################################################

  database-utilities:
    runs-on: [self-hosted, Windows]
    environment: ${{ inputs.environment }}
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Liquibase Environment
      uses: ./.github/workflows/setup-liquibase
 
    - name: Liquibase Utilities Flow
      run: liquibase flow --flow-file=liquibase-utilities.flowfile.yaml

    - name: Upload Reports Artifact
      if: always()
      uses: ./.github/workflows/upload-reports
      with:
        job-type: utilities
        upload-other: false

    - name: Upload Generate Changelog and Diff Changelog Artifacts
      if: github.event.inputs.utility == 'generate-changelog' || github.event.inputs.utility == 'diff-changelog'
      uses: actions/upload-artifact@v4
      with:
        name: ${{ inputs.environment }}-changelog.mssql.zip
        path: generatechangelogs
