# .github/workflows/install-mssql-client-tools/action.yml
name: 'Install MSSQL Client Tools'
description: 'Sets up sqlcmd'

runs:
  using: 'composite'
  steps:
    - name: Install MSSQL Client Tools (sqlcmd)
      shell: pwsh
      run: |
        choco install sqlserver-cmdlineutils -y

        # Locate sqlcmd and add its folder to GITHUB_PATH so later steps can call it directly
        $sqlcmdPath = (Get-Command sqlcmd -ErrorAction SilentlyContinue).Source
        if (-not $sqlcmdPath) {
          $sqlcmdPath = Get-ChildItem -Path "C:\Program Files\Microsoft SQL Server" -Recurse -Filter "sqlcmd.exe" -ErrorAction SilentlyContinue |
            Select-Object -First 1 -ExpandProperty FullName
        }
        if (-not $sqlcmdPath) {
          throw "sqlcmd.exe not found after installation"
        }
        $sqlcmdDir = Split-Path $sqlcmdPath -Parent
        Add-Content -Path $env:GITHUB_PATH -Value $sqlcmdDir

    - name: Check MSSQL client tools (sqlcmd) installation
      shell: pwsh
      run: |
        Write-Host "sqlcmd version:"
        sqlcmd -?