# .github/workflows/install-mssql-client-tools/action.yml
name: 'Install MSSQL Client Tools'
description: 'Sets up sqlcmd and sqlpackage'

runs:
  using: 'composite'
  steps:
    - name: Install MSSQL Client Tools (sqlcmd)
      shell: pwsh
      run: |
        $ErrorActionPreference = "Stop"

        # Look up the latest go-sqlcmd release and find the Windows amd64 zip asset
        $release = Invoke-RestMethod -Uri "https://api.github.com/repos/microsoft/go-sqlcmd/releases/latest" -Headers @{ "User-Agent" = "github-actions" }
        $asset = $release.assets | Where-Object { $_.name -like "*windows-amd64.zip" } | Select-Object -First 1
        if (-not $asset) {
          throw "Could not find a windows-amd64.zip asset in the latest go-sqlcmd release"
        }

        $zipPath = Join-Path $env:RUNNER_TEMP "sqlcmd.zip"
        $installDir = Join-Path $env:RUNNER_TEMP "sqlcmd"

        Invoke-WebRequest -Uri $asset.browser_download_url -OutFile $zipPath
        Expand-Archive -Path $zipPath -DestinationPath $installDir -Force

        # Add the folder containing sqlcmd.exe to PATH for later steps
        $sqlcmdDir = (Get-ChildItem -Path $installDir -Recurse -Filter "sqlcmd.exe" | Select-Object -First 1).DirectoryName
        if (-not $sqlcmdDir) {
          throw "sqlcmd.exe not found in extracted archive"
        }
        Add-Content -Path $env:GITHUB_PATH -Value $sqlcmdDir

    - name: Install MSSQL Client Tools (sqlpackage)
      shell: pwsh
      run: |
        $ErrorActionPreference = "Stop"
        $ProgressPreference = "SilentlyContinue"   # speeds up Invoke-WebRequest considerably

        $zipPath = Join-Path $env:RUNNER_TEMP "sqlpackage.zip"
        $installDir = Join-Path $env:RUNNER_TEMP "sqlpackage"

        # Microsoft's evergreen link to the latest self-contained sqlpackage for Windows (no .NET install required)
        Invoke-WebRequest -Uri "https://aka.ms/sqlpackage-windows" -OutFile $zipPath
        Expand-Archive -Path $zipPath -DestinationPath $installDir -Force

        # Add the folder containing sqlpackage.exe to PATH for later steps
        $sqlpackageDir = (Get-ChildItem -Path $installDir -Recurse -Filter "sqlpackage.exe" | Select-Object -First 1).DirectoryName
        if (-not $sqlpackageDir) {
          throw "sqlpackage.exe not found in extracted archive"
        }
        Add-Content -Path $env:GITHUB_PATH -Value $sqlpackageDir

    - name: Check MSSQL client tools installation
      shell: pwsh
      run: |
        Write-Host "sqlcmd version:"
        sqlcmd -?

        Write-Host "sqlpackage version:"
        sqlpackage /version
        if ($LASTEXITCODE -ne 0) {
          throw "sqlpackage is not available on PATH"
        }